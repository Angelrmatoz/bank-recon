[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-recon"
version = "0.1.0"
description = "Bank reconciliation engine with exact and fuzzy matching"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bank-recon = "recon.cli:main"

[tool.setuptools]
packages = ["recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
